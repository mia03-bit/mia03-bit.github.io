<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1>User Registration</h1>
        
        <p><strong>Required Fields:</strong></p>


        <form action="#" method="post">
            <label for="firstname">First Name:</label>
            <input type="text" id="first-name" name="firstname" placeholder="First Name" required>

            <label for="lastname">Last Name:</label>
            <input type="text" id="last-name" name="lastname"  placeholder="Last Name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"  placeholder="Email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"  placeholder="Phone Number" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="nationality">Nationality:</label>
            <input type="text" id="nationality" name="nationality" placeholder="Nationality" required>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" placeholder="Address" required></textarea>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="City" required>

            <label for="state">State/Province:</label>
            <input type="text" id="state" name="state" placeholder="State/Province" required>

            <label for="zip">Zip/Postal Code:</label>
            <input type="text" id="zip" name="zip" placeholder="Zip/Postal Code" required>

            <fieldset>
                <legend>Interests:</legend>
                <label><input type="checkbox" name="interests" value="music"> Music</label>
                <label><input type="checkbox" name="interests" value="sports"> Sports</label>
                <label><input type="checkbox" name="interests" value="technology"> Technology</label>
                <label><input type="checkbox" name="interests" value="art"> Art</label>
            </fieldset>

            <label for="bio">Brief Bio:</label>
            <textarea id="bio" name="bio" rows="4" placeholder="Your Bio" required></textarea>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" required>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
