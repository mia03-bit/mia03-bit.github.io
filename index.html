<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Here’s Our CVs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 20%, rgba(150, 40, 255, 0.25), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(255, 30, 140, 0.22), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(30, 100, 255, 0.18), transparent 35%),
                linear-gradient(135deg, #08080d, #11101c, #090b14);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            color: white;
        }

        /* Background glow */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: rgba(174, 65, 255, 0.12);
            filter: blur(100px);
            border-radius: 50%;
            top: -200px;
            left: -150px;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: rgba(255, 45, 160, 0.10);
            filter: blur(100px);
            border-radius: 50%;
            bottom: -200px;
            right: -150px;
            z-index: 0;
        }

        /* Decorative lines */

        .line {
            position: fixed;
            width: 1px;
            height: 100vh;
            background: linear-gradient(
                transparent,
                rgba(255,255,255,0.08),
                transparent
            );
            z-index: 0;
        }

        .line1 {
            left: 15%;
        }

        .line2 {
            left: 50%;
        }

        .line3 {
            right: 15%;
        }

        /* Main container */

        .container {
            width: 100%;
            max-width: 900px;
            padding: 55px;
            position: relative;
            z-index: 2;

            background: rgba(15, 14, 23, 0.78);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 28px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 100px rgba(0,0,0,0.65),
                0 0 50px rgba(150,50,255,0.08);

            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */

        .top-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            margin-bottom: 25px;
            border-radius: 10px;
        }

        .tag {
            color: #a855f7;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 52px;
            line-height: 1.05;
            margin-bottom: 15px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #d8b4fe,
                #f9a8d4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #9b98a8;
            font-size: 15px;
            line-height: 1.7;
            max-width: 600px;
            margin-bottom: 40px;
        }

        /* CV Grid */

        .cv-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .cv-card {
            position: relative;
            overflow: hidden;

            text-decoration: none;
            color: white;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 18px;

            padding: 28px;

            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }

        /* Card light */

        .cv-card::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(168,85,247,0.13);
            border-radius: 50%;
            filter: blur(45px);
            right: -80px;
            top: -80px;
            transition: 0.4s ease;
        }

        .cv-card:hover::before {
            background: rgba(236,72,153,0.25);
            transform: scale(1.5);
        }

        .cv-card:hover {
            transform: translateY(-8px);
            border-color: rgba(236,72,153,0.55);

            box-shadow:
                0 20px 45px rgba(0,0,0,0.45),
                0 0 30px rgba(168,85,247,0.12);
        }

        .cv-name {
            display: block;
            position: relative;
            z-index: 2;

            font-size: 19px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .cv-text {
            display: block;
            position: relative;
            z-index: 2;

            font-size: 11px;
            color: #888596;
            text-transform: uppercase;
            letter-spacing: 2px;

            transition: 0.3s ease;
        }

        .cv-card:hover .cv-text {
            color: #f0abfc;
        }

        /* Number */

        .number {
            position: absolute;
            right: 22px;
            top: 18px;

            font-size: 12px;
            color: #5f5b6d;
            letter-spacing: 2px;
        }

        /* Footer */

        .footer {
            margin-top: 40px;
            padding-top: 22px;

            border-top: 1px solid rgba(255,255,255,0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: #686575;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer span {
            color: #a855f7;
        }

        /* Mobile */

        @media (max-width: 650px) {

            body {
                padding: 20px;
            }

            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 38px;
            }

            .cv-list {
                grid-template-columns: 1fr;
            }

            .footer {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>

            <a href="delacruz.html" class="cv-card">

            <a href="lalata.html" class="cv-card">

        <div class="footer">

        </div>

    </div>

</body>
</html>
