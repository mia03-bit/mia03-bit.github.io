
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Name | CV & Portfolio</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            line-height: 1.6;
            color: #1e293b;
            background: #f8fafc;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .container {
            width: min(1120px, 90%);
            margin: auto;
        }

        /* ==============================
           NAVIGATION
        ============================== */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid #e2e8f0;
        }

        nav {
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;

            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .menu-btn {
            display: none;

            border: none;
            background: transparent;

            font-size: 1.5rem;
            cursor: pointer;
        }

        /* ==============================
           HERO
        ============================== */

        .hero {
            min-height: 100vh;
            padding-top: 72px;

            display: flex;
            align-items: center;

            background:
                radial-gradient(
                    circle at 85% 20%,
                    rgba(37, 99, 235, 0.12),
                    transparent 30%
                ),
                #f8fafc;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 70px;
            align-items: center;
        }

        .hero-text .small-title {
            color: #2563eb;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .hero-text h1 {
            font-size: clamp(2.7rem, 6vw, 5rem);
            line-height: 1.05;
            color: #0f172a;
            margin-bottom: 20px;
            letter-spacing: -3px;
        }

        .hero-text h1 span {
            color: #2563eb;
        }

        .hero-text p {
            max-width: 600px;
            color: #64748b;
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 13px 22px;

            border-radius: 8px;

            font-weight: 600;
            font-size: 0.9rem;

            transition: 0.3s ease;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            border: 1px solid #cbd5e1;
            color: #334155;
            background: white;
        }

        .btn-secondary:hover {
            border-color: #2563eb;
            color: #2563eb;
            transform: translateY(-2px);
        }

        /* Profile */

        .profile-wrapper {
            display: flex;
            justify-content: center;
        }

        .profile-card {
            width: 300px;
            padding: 12px;

            background: white;
            border-radius: 20px;

            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.12);

            transform: rotate(2deg);
            transition: 0.4s ease;
        }

        .profile-card:hover {
            transform: rotate(0deg) translateY(-5px);
        }

        .profile-photo {
            width: 100%;
            aspect-ratio: 1 / 1;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #eff6ff
            );

            color: #2563eb;
            font-size: 4rem;
            font-weight: 800;
        }

        /* ==============================
           GENERAL SECTION
        ============================== */

        section {
            padding: 100px 0;
        }

        .section-header {
            margin-bottom: 50px;
        }

        .section-header span {
            color: #2563eb;
            font-size: 0.8rem;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-header h2 {
            font-size: 2.3rem;
            color: #0f172a;
            margin-top: 8px;
        }

        .section-header p {
            color: #64748b;
            max-width: 600px;
            margin-top: 10px;
        }

        

        .about {
            background: white;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text p {
            color: #64748b;
            margin-bottom: 18px;
        }

        .personal-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-item {
            padding: 18px;

            background: #f8fafc;
            border: 1px solid #e2e8f0;

            border-radius: 10px;
        }

        .info-item small {
            display: block;
            color: #94a3b8;
            font-size: 0.75rem;
            margin-bottom: 3px;
        }

        .info-item strong {
            color: #334155;
            font-size: 0.9rem;
        }

        /* ==============================
           SKILLS
        ============================== */

        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px 60px;
        }

        .skill {
            margin-bottom: 15px;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;

            margin-bottom: 7px;

            font-size: 0.9rem;
            font-weight: 600;
        }

        .skill-header span:last-child {
            color: #64748b;
        }

        .skill-bar {
            height: 7px;

            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .skill-progress {
            height: 100%;
            background: #2563eb;
            border-radius: 20px;
        }

        /* ==============================
           EXPERIENCE
        ============================== */

        .experience {
            background: white;
        }

        .timeline {
            border-left: 2px solid #dbeafe;
            padding-left: 30px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 40px;
        }

        .timeline-item::before {
            content: "";

            position: absolute;

            left: -40px;
            top: 5px;

            width: 17px;
            height: 17px;

            background: #2563eb;
            border: 4px solid white;

            border-radius: 50%;

            box-shadow: 0 0 0 2px #dbeafe;
        }

        .timeline-date {
            color: #2563eb;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .timeline-item h3 {
            margin: 5px 0;
            color: #0f172a;
        }

        .timeline-item h4 {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .timeline-item p {
            color: #64748b;
            max-width: 700px;
        }

        /* ==============================
           PROJECTS
        ============================== */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .project-card {
            padding: 28px;

            background: white;
            border: 1px solid #e2e8f0;

            border-radius: 14px;

            transition: 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: #bfdbfe;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }

        .project-icon {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eff6ff;
            color: #2563eb;

            border-radius: 10px;

            font-size: 1.3rem;

            margin-bottom: 20px;
        }

        .project-card h3 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        .project-card p {
            color: #64748b;
            font-size: 0.9rem;
        }

        .tags {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;

            margin-top: 20px;
        }

        .tag {
            padding: 5px 9px;

            background: #f1f5f9;
            color: #475569;

            border-radius: 5px;

            font-size: 0.7rem;
            font-weight: 600;
        }

        /* ==============================
           CONTACT
        ============================== */

        .contact {
            background: #0f172a;
            color: white;
        }

        .contact .section-header h2 {
            color: white;
        }

        .contact .section-header p {
            color: #94a3b8;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .contact-card {
            padding: 25px;

            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 12px;

            transition: 0.3s ease;
        }

        .contact-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
        }

        .contact-card small {
            display: block;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .contact-card strong {
            font-size: 0.9rem;
        }
